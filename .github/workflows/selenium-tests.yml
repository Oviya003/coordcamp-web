name: Web E2E Selenium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Run Selenium Tests
      run: node selenium-tests/tests/login-tests.js

    - name: Upload Test Report to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Selenium_Login_Execution_Report
        path: Selenium_Login_Execution_Report.xlsx
